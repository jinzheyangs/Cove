groups:
  - name: cove-api
    rules:
      - alert: CoveApiDown
        expr: up{job="cove-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cove API 不可达"
          description: "Prometheus 已连续 2 分钟抓不到 {{ $labels.instance }} 的指标。"

      - alert: CoveHigh5xxRate
        expr: |
          sum(rate(cove_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(cove_http_requests_total[5m])), 0.001)
          > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx 比例超过 1%"
          description: "过去 5 分钟 5xx 占比 {{ $value | humanizePercentage }}。"

      - alert: CoveHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(cove_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 延迟超过 1 秒"
          description: "过去 10 分钟 P95 延迟 {{ $value }}s。"

      - alert: CoveAiCircuitOpen
        expr: cove_ai_circuit_open > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "AI 熔断器已打开"
          description: "大模型调用连续失败，模拟TA 和 Agent 进入降级状态。"

      - alert: CoveAiHighFailureRate
        expr: |
          sum(rate(cove_ai_calls_total{result="failure"}[10m]))
          /
          clamp_min(sum(rate(cove_ai_calls_total[10m])), 0.001)
          > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI 调用失败率超过 20%"
          description: "过去 10 分钟失败率 {{ $value | humanizePercentage }}。"

      - alert: CoveCoinReconcileMismatch
        expr: cove_coin_reconcile_mismatches > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "金币对账不一致"
          description: "有 {{ $value }} 个账户的缓存余额与流水不一致，需要人工核对。"
