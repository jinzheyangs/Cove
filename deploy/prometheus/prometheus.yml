global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "cove-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # worker 暂时没有独立的 metrics 端点；如果以后加上，在这里追加 target
