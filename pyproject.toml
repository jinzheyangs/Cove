[project]
name = "cove"
version = "0.1.0"
description = "Cove — 情侣关系经营 App 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # 上限 2.1：opentelemetry-instrumentation-sqlalchemy 目前只支持 < 2.1
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "cryptography>=43.0.0",
    "openai>=1.57.0",
    "chromadb-client>=0.5.0",
    "tzdata>=2024.2",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
]

# OSS 是可选依赖：只有 STORAGE_BACKEND=oss 的生产环境需要
[project.optional-dependencies]
oss = ["oss2>=2.18.4"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
