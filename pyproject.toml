[project]
name = "cove"
version = "0.1.0"
description = "Cove — 情侣关系经营 App 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "gunicorn>=26.2.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    # 上限 2.1：opentelemetry-instrumentation-sqlalchemy 目前只支持 < 2.1
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "arq>=0.28.0",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "cryptography>=50.0.2",
    "openai>=3.42.1",
    "tzdata>=2026.6",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
